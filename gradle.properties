#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Tue Aug 18 03:08:03 GMT 2026
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# Phase 2 gate: keep the proven JNI baseline buildable until the local FFmpeg
# artifacts have been generated by scripts/build_ffmpeg_android_arm64.sh.
recapflow.ffmpeg.enabled=false
